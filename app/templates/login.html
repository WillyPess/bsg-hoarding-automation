{% extends "base.html" %}
{% block title %}Log in · BSG Hoarding{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if not has_users %}
<p class="fail">No users yet. On this PC, run:<br><code>python -m app.users add gus --role estimator</code></p>
{% endif %}
{% if message %}<p class="fail" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login" class="login">
  <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
  <input type="hidden" name="next" value="{{ next_ }}">
  <label>Name <input name="name" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
