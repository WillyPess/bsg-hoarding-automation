<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BSG Hoarding{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/">BSG Hoarding</a>
    {% if user %}
    <nav>
      <a href="/jobs">Jobs</a>
      <a href="/examples">Examples</a>
      <a href="/health">Health</a>
    </nav>
    <form method="post" action="/logout" class="who">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <span>{{ user.name }} ({{ user.role }})</span>
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Data folder: {{ settings.data_dir }} · AI reviewer: {{ "on" if settings.ai.enabled else "off" }}</footer>
</body>
</html>
